<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Mini POS - Kasir Kantin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Aplikasi Mini POS - Kantin Kampus</h1>

    <!-- Form Input Barang -->
    <section class="card">
      <h2>Tambah Barang</h2>
      <form id="item-form">
        <div class="form-group">
          <label for="item-name">Nama Barang</label>
          <input type="text" id="item-name" placeholder="Contoh: Buku Tulis">
          <small class="error-text" id="error-name"></small>
        </div>

        <div class="form-group">
          <label for="item-price">Harga Satuan (Rp)</label>
          <input type="number" id="item-price" placeholder="Minimal 500">
          <small class="error-text" id="error-price"></small>
        </div>

        <div class="form-group">
          <label for="item-qty">Jumlah (Qty)</label>
          <input type="number" id="item-qty" placeholder="Minimal 1" value="1">
          <small class="error-text" id="error-qty"></small>
        </div>

        <button type="submit" class="btn btn-primary">Tambah ke Keranjang</button>
      </form>
    </section>

    <!-- Tabel Keranjang Belanja -->
    <section class="card">
      <h2>Keranjang Belanja</h2>
      <table class="cart-table">
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Barang</th>
            <th>Harga</th>
            <th>Qty</th>
            <th>Subtotal</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="cart-tbody">
          <!-- Item dimasukkan lewat JavaScript -->
        </tbody>
      </table>

      <!-- Ringkasan Perhitungan -->
      <div class="summary-section">
        <p>Total Belanja: <strong id="text-total">Rp 0</strong></p>
        <p>Diskon (10% min. Rp 50.000): <strong id="text-discount">Rp 0</strong></p>
        <p class="grand-total">Total Akhir: <strong id="text-grand-total">Rp 0</strong></p>
      </div>

      <!-- Pembayaran -->
      <div class="payment-section">
        <div class="form-group">
          <label for="pay-amount">Uang Bayar (Rp)</label>
          <input type="number" id="pay-amount" placeholder="Masukkan jumlah uang">
        </div>
        <p id="payment-status" class="payment-status"></p>
        
        <button id="btn-reset" class="btn btn-danger">Transaksi Baru / Reset</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
